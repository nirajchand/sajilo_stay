name: sajilo_stay
description: "Sajilo Stay - A hospitality booking app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # state management
  flutter_riverpod: ^3.0.3

  # permissions
  equatable: ^2.0.7
  dartz: ^0.10.1
  permission_handler: ^12.0.1

  # media handling
  image_picker: ^1.0.7

  # Local Database (Offline Storage)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  path: ^1.9.0

  # Networking
  dio: ^5.4.1
  dio_smart_retry: ^7.0.1
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^7.0.0

  # Authentication
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.4
  jwt_decoder: ^2.0.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1

  # Map
  flutter_map: ^7.0.2
  latlong2: ^0.9.0

  # Payment — InAppWebView gives us third-party cookies + reliable
  # shouldOverrideUrlLoading in one package.
  flutter_inappwebview: ^6.1.5

  # utilities
  uuid: ^4.3.3
  json_annotation: ^4.9.0
  flutter_launcher_icons: ^0.14.4

  sensors_plus: ^4.0.2
  light: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

  # Code Generation
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: "launcher_icons"
  ios: "AppIcon"
  image_path: "assets/images/project_logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
